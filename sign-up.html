<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h1>Create Account</h1>
            <p class="subtitle">Join us today and get started</p>

            <form id="signupForm">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" placeholder="John" required>
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    <div class="error-message"></div>
                </div>

                <div class="password-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <div class="error-message"></div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
                        <div class="error-message"></div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Create Account</button>

                <p class="form-footer">
                    Already have an account? <a href="sign-in.html">Sign In</a>
                </p>

                <p class="terms">
                    By creating an account, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        const signupForm = document.getElementById('signupForm');
        const inputs = signupForm.querySelectorAll('input');

        inputs.forEach(input => {
            input.addEventListener('focus', function () {
                const errorMsg = this.parentElement.querySelector('.error-message');
                errorMsg.style.display = 'none';
            });
        });

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function isValidPassword(password) {
            return password.length >= 8;
        }

        signupForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            let isValid = true;

            document.querySelectorAll('.error-message').forEach(msg => {
                msg.style.display = 'none';
            });

            if (!firstName) {
                showError(document.getElementById('firstName'), 'First name is required');
                isValid = false;
            }

            if (!lastName) {
                showError(document.getElementById('lastName'), 'Last name is required');
                isValid = false;
            }

            if (!email) {
                showError(document.getElementById('email'), 'Email is required');
                isValid = false;
            } else if (!isValidEmail(email)) {
                showError(document.getElementById('email'), 'Please enter a valid email');
                isValid = false;
            }

            if (!password) {
                showError(document.getElementById('password'), 'Password is required');
                isValid = false;
            } else if (!isValidPassword(password)) {
                showError(document.getElementById('password'), 'Password must be at least 8 characters');
                isValid = false;
            }

            if (password !== confirmPassword) {
                showError(document.getElementById('confirmPassword'), 'Passwords do not match');
                isValid = false;
            }

            if (isValid) {
                alert(`Welcome ${firstName}! Your account has been created successfully.`);
                
                localStorage.setItem('user', JSON.stringify({
                    firstName: firstName,
                    lastName: lastName,
                    email: email
                }));

                signupForm.reset();

                setTimeout(() => {
                    window.location.href = 'sign-in.html';
                }, 1500);
            }
        });

        function showError(input, message) {
            const errorMsg = input.parentElement.querySelector('.error-message');
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
            input.style.borderColor = '#e74c3c';
            input.style.backgroundColor = '#ffe6e6';
        }
    </script>
</body>
</html>
