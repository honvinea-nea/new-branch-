<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to your account</p>

            <form id="signinForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    <div class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <div class="error-message"></div>
                </div>

                <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
                    <label style="margin-bottom: 0; font-weight: normal;">
                        <input type="checkbox" id="rememberMe" name="rememberMe" style="margin-right: 8px; cursor: pointer;">
                        Remember me
                    </label>
                    <a href="#" style="color: #667eea; text-decoration: none; font-size: 14px;">Forgot Password?</a>
                </div>

                <button type="submit" class="submit-btn">Sign In</button>

                <p class="form-footer">
                    Don't have an account? <a href="sign-up.html">Create one</a>
                </p>

                <p class="terms">
                    By signing in, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        const signinForm = document.getElementById('signinForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberMeCheckbox = document.getElementById('rememberMe');

        [emailInput, passwordInput].forEach(input => {
            input.addEventListener('focus', function () {
                const errorMsg = this.parentElement.querySelector('.error-message');
                errorMsg.style.display = 'none';
            });
        });

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        window.addEventListener('load', function () {
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            if (rememberedEmail) {
                emailInput.value = rememberedEmail;
                rememberMeCheckbox.checked = true;
            }
        });

        signinForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            let isValid = true;

            document.querySelectorAll('.error-message').forEach(msg => {
                msg.style.display = 'none';
            });

            if (!email) {
                showError(emailInput, 'Email is required');
                isValid = false;
            } else if (!isValidEmail(email)) {
                showError(emailInput, 'Please enter a valid email');
                isValid = false;
            }

            if (!password) {
                showError(passwordInput, 'Password is required');
                isValid = false;
            }

            const storedUser = localStorage.getItem('user');
            if (isValid) {
                if (storedUser) {
                    const user = JSON.parse(storedUser);
                    if (user.email !== email) {
                        showError(emailInput, 'Email not found');
                        isValid = false;
                    }
                } else {
                    showError(emailInput, 'No user found with this email. Please sign up first.');
                    isValid = false;
                }
            }

            if (isValid) {
                if (rememberMeCheckbox.checked) {
                    localStorage.setItem('rememberedEmail', email);
                } else {
                    localStorage.removeItem('rememberedEmail');
                }

                const user = JSON.parse(localStorage.getItem('user'));
                alert(`Welcome back, ${user.firstName}!`);

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            }
        });

        function showError(input, message) {
            const errorMsg = input.parentElement.querySelector('.error-message');
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
            input.style.borderColor = '#e74c3c';
            input.style.backgroundColor = '#ffe6e6';
        }
    </script>
</body>
</html>
